[project]
name = "archinstaller"
version = "0.1.0"
description = "Automated Arch Linux installation over SSH into the live ISO environment"
authors = []
requires-python = ">=3.13"
dependencies = ["paramiko (>=3.5,<4.0)"]

[tool.poetry]
packages = [
    { include = "archinstaller" },
]

[tool.poetry.scripts]
archinstaller = "archinstaller.__main__:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
]
