[project]
name = "archpkg"
version = "0.1.0"
description = "Arch Linux package list sorter and graphical-stack classifier"
authors = []
requires-python = ">=3.13"
dependencies = ["pyalpm (>=0.10.12,<0.11.0)"]

[project.optional-dependencies]
pyalpm = ["pyalpm"]

[tool.poetry]
packages = [
    { include = "archpkg" },
]

[tool.poetry.scripts]
archpkg = "archpkg.__main__:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
]
