services:
  repo:
    build:
      context: .
      dockerfile: Dockerfile.repo
    image: zcode-repo:latest
    container_name: zcode-repo
    # 8283: adjacent to the arch-cache-mirror port (8282); unassigned by
    # IANA, unprivileged, below the Linux ephemeral range.
    ports:
      - "8283:8080"
    volumes:
      - ./repo:/srv:ro
    restart: unless-stopped
